name: Build validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 5 SDK (legacy project)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '5.0.x'

      - name: Restore
        run: dotnet restore FilmesAPI.sln

      - name: Build
        run: dotnet build FilmesAPI.sln --no-restore --configuration Release
