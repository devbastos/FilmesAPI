name: MySQL integration tests
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run MySQL integration tests
        run: dotnet test FilmesAPI.Tests/FilmesAPI.Tests.csproj --filter FullyQualifiedName~FilmeMySqlIntegrationTests --configuration Release
