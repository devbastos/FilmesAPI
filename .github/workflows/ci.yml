name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore FilmesAPI.sln
      - name: Build
        run: dotnet build FilmesAPI.sln -c Release --no-restore
      - name: Test
        run: dotnet test FilmesAPI.Tests/FilmesAPI.Tests.csproj -c Release --no-restore
