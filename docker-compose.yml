services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_dev}
      MYSQL_DATABASE: filmesdb
      MYSQL_USER: filmes
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-filmes_local_dev}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    volumes:
      - ./:/src
    environment:
      ConnectionStrings__FilmeConnection: "server=mysql;port=3306;database=filmesdb;user=filmes;password=${MYSQL_PASSWORD:-filmes_local_dev}"
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "dotnet tool install --global dotnet-ef --version 9.0.10 &&
             /root/.dotnet/tools/dotnet-ef database update --project FilmesAPI/FilmesAPI.csproj"
    profiles: ["setup"]

  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FilmeConnection: "server=mysql;port=3306;database=filmesdb;user=filmes;password=${MYSQL_PASSWORD:-filmes_local_dev}"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    profiles: ["app"]

volumes:
  mysql_data:
